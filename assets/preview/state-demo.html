<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>状态小人 · 七状态演示</title>
<style>
:root{--bg:#e9e6ef;--panel:#f7f5fa;--ink:#2b2633;--mute:#6f6878;--line:#d3cedb;--accent:#d96f12;--stage:#c9c4d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b22;--panel:#26232d;--ink:#ece8f2;--mute:#9a93a5;--line:#3a3644;--accent:#f0913a;--stage:#2f2b38}}
:root[data-theme="dark"]{--bg:#1d1b22;--panel:#26232d;--ink:#ece8f2;--mute:#9a93a5;--line:#3a3644;--accent:#f0913a;--stage:#2f2b38}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
main{max-width:1040px;margin:0 auto;padding:24px 18px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}
@media (max-width:780px){main{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 4px;grid-column:1/-1}
.sub{grid-column:1/-1;margin:0 0 6px;color:var(--mute);max-width:72ch}
.stage{background:var(--stage);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:18px;min-height:460px;position:relative;overflow:auto}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#tag{position:absolute;left:12px;top:10px;font-size:13px;color:var(--mute)}
#tag b{color:var(--ink);font-weight:600}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{text-align:left;line-height:1.3}
.grid button small{display:block;color:var(--mute);font-size:12px}
.grid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid button[aria-pressed="true"] small{color:#fff;opacity:.85}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 10px;border-radius:4px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;gap:8px;align-items:center;cursor:pointer}
.hint{font-size:13px;color:var(--mute);margin:0}
.layers{grid-column:1/-1}
.layers h2{font-size:16px;margin:4px 0 8px}
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute);max-width:178px;text-align:center}
.cell canvas{background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/12px 12px;border-radius:3px;width:178px;height:229px}
.op{font-size:20px;color:var(--mute);padding-bottom:34px}
</style></head><body>
<main>
<h1>状态小人：七个状态</h1>
<p class="sub">动画参数全部读自内嵌的 manifest.json，和 runtime 里那份是同一个文件。点状态按钮可以手动切，完成状态播 2.2 秒后自动回到空闲，错误状态会一直停着。工具失败不是状态，而是在当前画面上闪一下汗珠。</p>
<div class="stage"><div id="tag">状态：<b id="cur"></b></div><canvas id="cv" width="119" height="153"></canvas></div>
<aside>
  <div class="grid" id="states"></div>
  <button id="fail">模拟工具失败 <small style="color:var(--mute)">PostToolUseFailure</small></button>
  <label><input type="checkbox" id="auto" checked>按一次典型任务的顺序自动播放</label>
  <p class="hint" id="autohint">空闲 → 思考 → 工作中（中途一次工具失败）→ 等待确认 → 工作中 → 完成 → 空闲 → 思考 → 错误 → 睡觉</p>
  <label>放大倍数 <input type="range" id="zoom" min="2" max="6" value="4"></label>
</aside>
<section class="layers">
  <h2>这一帧由哪几层叠成</h2>
  <div class="strip">
    <div class="cell"><canvas id="l0" width="119" height="153"></canvas><span id="n0"></span></div><div class="op">+</div>
    <div class="cell"><canvas id="l1" width="119" height="153"></canvas><span id="n1"></span></div><div class="op">+</div>
    <div class="cell"><canvas id="l2" width="119" height="153"></canvas><span id="n2"></span></div><div class="op">+</div>
    <div class="cell"><canvas id="l3" width="119" height="153"></canvas><span id="n3"></span></div>
  </div>
</section>
</main>

;
const NAMES={idle:['空闲','SessionStart'],think:['思考','UserPromptSubmit'],working:['工作中','PreToolUse'],notice:['等待确认','Notification'],done:['完成','Stop'],error:['错误','StopFailure'],sleep:['睡觉','长时间无活动']};
const IMG={};let loaded=0;const keys=Object.keys(SRC);
keys.forEach(k=>{const i=new Image();i.onload=()=>{if(++loaded===keys.length)start()};i.src=SRC[k];IMG[k+'.png']=i;});
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),L=[0,1,2,3].map(i=>$('l'+i).getContext('2d'));
const [SW,SH]=M.stage.size,[OX,OY]=M.stage.characterOffset;
const st={name:'idle',body:'main.png',q:[],qT:Infinity,hairI:0,hairT:0,eye:null,eyeQ:[],eyeT:0,nextBlink:0,
  fx:[],react:[],reactQ:[],reactT:0,fxI:0,fxT:0,fxMode:null,popQ:[],nextPop:0,bob:0,bobT:0,tapT:0,tapLeft:0,doneT:Infinity};
const S=()=>M.states[st.name];
// 按钮
for(const k of Object.keys(M.states)){const b=document.createElement('button');b.dataset.s=k;b.innerHTML=`${NAMES[k][0]}<small>${NAMES[k][1]}</small>`;b.onclick=()=>{$('auto').checked=false;go(k,performance.now())};$('states').appendChild(b)}
function setZoom(z){cv.style.width=SW*z+'px';cv.style.height=SH*z+'px'}
function playQ(q,t){st.q=q.map(x=>x.slice());nextQ(t)}
function nextQ(t){const e=st.q.shift();if(!e){st.qT=Infinity;return}st.body=e[0];st.qT=e[1]?t+e[1]:Infinity}
function go(name,t){
  if(name===st.name)return;const old=S();st.name=name;const s=S();
  const seq=[...(old.exit||[]),...(s.enter||[]),[s.body,0]];playQ(seq,t);
  st.fx=[];st.fxMode=null;st.popQ=[];st.doneT=s.durationMs?t+s.durationMs:Infinity;
  const delay=(old.exit||[]).concat(s.enter||[]).reduce((a,b)=>a+b[1],0);
  if(s.fx){if(s.fx.loop){st.fxMode='loop';st.fxI=-1;st.fxT=t+delay}else{st.fxMode='pop';st.nextPop=t+delay}}
  if(s.tap){st.tapT=t+delay+300;st.tapLeft=0}
  if(s.eyes!=='blink'){st.eyeQ=[];st.eye=null}
  document.querySelectorAll('#states button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===name));
  $('cur').textContent=NAMES[name][0];
}
function react(name,t){const r=M.reactions[name];st.reactName=name;st.reactQ=r.frames.slice();st.react=st.reactQ[0].sprites;st.reactT=t+st.reactQ[0].ms}
function fxFrame(f){st.fx=f.sprites.map(x=>x.slice())}
function tick(t){
  const s=S();
  if(t>st.hairT){st.hairI=(st.hairI+1)%4;st.hairT=t+(s.hairFrameMs||M.hair.frameMs)}
  if(t>=st.qT)nextQ(t);
  // 眼睛
  if(s.eyes==='blink'){
    if(!st.eyeQ.length&&t>st.nextBlink){st.eyeQ=M.eyes.blink.map(x=>x.slice());st.eye=st.eyeQ[0][0];st.eyeT=t+st.eyeQ[0][1]}
    if(st.eyeQ.length&&t>=st.eyeT){st.eyeQ.shift();if(st.eyeQ.length){st.eye=st.eyeQ[0][0];st.eyeT=t+st.eyeQ[0][1]}else{st.eye=null;st.nextBlink=t+M.eyes.intervalMs[0]+Math.random()*(M.eyes.intervalMs[1]-M.eyes.intervalMs[0])}}
  }else st.eye=s.eyes==='off'?null:s.eyes;
  // 特效
  if(st.fxMode==='loop'&&t>=st.fxT){st.fxI=(st.fxI+1)%s.fx.loop.length;fxFrame(s.fx.loop[st.fxI]);st.fxT=t+s.fx.loop[st.fxI].ms}
  if(st.fxMode==='pop'){
    if(!st.popQ.length&&t>=st.nextPop){st.popQ=s.fx.pop.slice();fxFrame(st.popQ[0]);st.fxT=t+st.popQ[0].ms}
    else if(st.popQ.length&&t>=st.fxT){st.popQ.shift();if(st.popQ.length){fxFrame(st.popQ[0]);st.fxT=t+st.popQ[0].ms}else{st.fx=[[s.fx.hold.sprite,0,0]];st.bob=0;st.bobT=t+s.fx.hold.bobMs;st.nextPop=t+s.fx.repeatMs}}
    if(!st.popQ.length&&st.fx.length&&t>st.bobT){st.bob=st.bob?0:s.fx.hold.bobPx;st.bobT=t+s.fx.hold.bobMs}
  }
  // 打字
  if(s.tap&&!st.q.length&&st.qT===Infinity&&t>st.tapT){const p=s.tap;
    if(st.body===p.frame){st.body=s.body;st.tapT=t+(st.tapLeft>0?p.gapMs[0]+Math.random()*(p.gapMs[1]-p.gapMs[0]):p.pauseMs[0]+Math.random()*(p.pauseMs[1]-p.pauseMs[0]))}
    else{if(st.tapLeft<=0)st.tapLeft=p.burst[0]+Math.floor(Math.random()*(p.burst[1]-p.burst[0]+1));st.tapLeft--;st.body=p.frame;st.tapT=t+p.downMs}}
  if(st.reactQ.length&&t>=st.reactT){st.reactQ.shift();if(st.reactQ.length){st.react=st.reactQ[0].sprites;st.reactT=t+st.reactQ[0].ms}else st.react=[]}
  if(t>=st.doneT){st.doneT=Infinity;go(s.then,t)}
  auto(t);render();requestAnimationFrame(tick)}
const PLAN=[['think',2600],['working',2000],['!toolFailure',2400],['think',2000],['notice',4800],['working',3600],['done',2600],['idle',2500],['think',2000],['error',4500],['sleep',5000],['idle',2500]];
let planI=0,planT=0;
function auto(t){if(!$('auto').checked||t<planT)return;const [n,ms]=PLAN[planI];planI=(planI+1)%PLAN.length;if(n[0]==='!')react(n.slice(1),t);else if(n!==st.name)go(n,t);planT=t+ms}
function d(c,n,x,y){if(n&&IMG[n])c.drawImage(IMG[n],x,y)}
function render(){
  const s=S(),h=M.hair.frames[st.hairI];
  ctx.clearRect(0,0,SW,SH);L.forEach(c=>c.clearRect(0,0,SW,SH));
  for(const c of[ctx,L[0]])d(c,h,OX,OY);
  for(const c of[ctx,L[1]])d(c,st.body,OX,OY);
  for(const c of[ctx,L[2]])d(c,st.eye,OX,OY);
  if(s.fx){const [ax,ay]=s.fx.anchor;for(const c of[ctx,L[3]])st.fx.forEach(([n,dx,dy])=>{const im=IMG[n];const b=(st.fxMode==='pop'&&!st.popQ.length)?st.bob:0;d(c,n,ax+dx,ay-im.height+dy+b)})}
  if(st.react.length){const [ax,ay]=M.reactions[st.reactName].anchor;for(const c of[ctx,L[3]])st.react.forEach(([n,dx,dy])=>{d(c,n,ax+dx,ay-IMG[n].height+dy)})}
  $('n0').textContent='后发 '+h;$('n1').textContent='主体 '+st.body;$('n2').textContent='眼睛 '+(st.eye||'（无）');
  {const all=[...st.fx,...st.react];$('n3').textContent='特效 '+(all.length?[...new Set(all.map(f=>f[0]))].join(' '):'（无）')}
}
function start(){setZoom(4);const t=performance.now();st.hairT=t+800;st.nextBlink=t+1500;planT=t+2500;go('sleep',t);go('idle',t);requestAnimationFrame(tick)}
$('fail').onclick=()=>react('toolFailure',performance.now());
$('zoom').oninput=e=>setZoom(+e.target.value);
</script></body></html>
