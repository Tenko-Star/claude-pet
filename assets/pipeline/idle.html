<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素小人 · 空闲动画试做</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--page:#F2EEEA;--ink:#3A2620;--muted:#7A655B;--line:#DDD3CB;--chip:#FFFFFF;--accent:#E8743B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#1D1917;--ink:#F1E6DE;--muted:#B3A196;--line:#3A312D;--chip:#29221F}}
:root[data-theme="dark"]{--page:#1D1917;--ink:#F1E6DE;--muted:#B3A196;--line:#3A312D;--chip:#29221F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Silkscreen","PingFang SC","Microsoft YaHei",monospace;font-size:26px;line-height:1.25;margin:4px 0 4px;font-weight:400}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.stage-wrap{display:flex;justify-content:center;align-items:center;padding:24px;border:3px solid var(--ink);overflow-x:auto;min-height:300px}
.stage-wrap.dark{background:#2E2A33}.stage-wrap.light{background:#E9EEF2}
.stage-wrap.check{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/16px 16px}
#stage{image-rendering:pixelated;display:block;max-width:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--chip);color:var(--ink);font:600 14px/1 inherit;padding:10px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:#2A1A12;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.scale{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:14px}
label.scale input{flex:1;accent-color:var(--accent)}
h2{font-size:18px;margin:32px 0 8px;border-top:2px solid var(--line);padding-top:14px}
p{max-width:66ch}
#sheet{display:flex;flex-wrap:wrap;gap:12px}
#sheet figure{margin:0;padding:8px;background:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0) 0 0/12px 12px;border:2px solid var(--line)}
#sheet img{width:188px;image-rendering:pixelated;display:block}
#sheet figcaption{font:12px ui-monospace,Consolas,monospace;color:#3A2620;margin-top:4px}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
<h1>Idle test</h1>
<p class="sub">第二版：主体换成去掉后发的图，后发改为逐帧差分。真实分辨率 119×129，按整数倍放大显示</p>
<div class="stage-wrap dark"><canvas id="stage" aria-label="像素小人空闲动画"></canvas></div>
<div class="row" role="group" aria-label="动画开关">
  <button class="btn" data-opt="blink">眨眼</button>
  <button class="btn" data-opt="sway">后发摆动</button>
  <button class="btn" data-opt="talk">说话</button>
  <button class="btn" data-opt="big">左飘用大幅度版</button>
</div>
<div class="row" role="group" aria-label="背景">
  <button class="btn" data-bg="dark" aria-pressed="true">深色桌面</button>
  <button class="btn" data-bg="light" aria-pressed="false">浅色桌面</button>
  <button class="btn" data-bg="check" aria-pressed="false">透明格</button>
</div>
<label class="scale">每帧时长<input id="speed" type="range" min="150" max="800" step="50" value="350"><span id="speedOut">350ms</span></label>
<label class="scale">放大倍数<input id="scale" type="range" min="1" max="6" step="1" value="3"><span id="scaleOut">3×</span></label>

<h2>拆出来的图层</h2>
<p>main 是去掉后发的主体，hair_c、hair_l、hair_r 是后发的中、左、右三帧，hair_l_big 是第一版大幅度左飘，eye_half、eye_closed、mouth_open 是表情补丁。所有图层画布相同，按"后发、主体、表情"的顺序叠放即可。</p>
<div id="sheet"></div>
</main>
<script type="module">/*BUNDLE*/</script>
</body>
</html>
